<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STICKSABER audio</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b0d12; --panel: #141821; --line: #252b38; --text: #d7deea; --dim: #7d889c; --accent: #5fd4ff; --bad: #ff6b6b; --good: #6bffb0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; letter-spacing: .08em; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 18px 0 8px; }
  p { color: var(--dim); margin: 0 0 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button { background: #1d2330; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: #12394a; border-color: var(--accent); }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); margin-right: 14px; }
  input[type=range] { width: 140px; }
  table { border-collapse: collapse; width: 100%; font: 12px/1.3 ui-monospace, monospace; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  .bad { color: var(--bad); }
  .good { color: var(--good); }
  pre { white-space: pre-wrap; font: 12px/1.35 ui-monospace, monospace; color: var(--dim); max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<h1>STICKSABER — audio</h1>
<p>Soundboard for <code>src/audio/audio.js</code>. The first click starts audio. Shift-click a sound to fire it 8 times quickly (variation and rate-limit check).</p>

<section>
  <div class="row">
    <label>master <input id="vMaster" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label>sfx <input id="vSfx" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label>music <input id="vMusic" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label>slow-mo <input id="slowmo" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label>pitch <input id="pitch" type="range" min="0.5" max="2" step="0.01" value="1"></label>
    <label>pan <input id="pan" type="range" min="-1" max="1" step="0.01" value="0"></label>
  </div>
</section>

<section id="sfx"></section>

<section>
  <h2>Hum</h2>
  <div class="row">
    <button id="humToggle">blade lit</button>
    <label>swing speed <input id="humSpeed" type="range" min="0" max="1" step="0.01" value="0"></label>
    <button id="humSwing">auto-swing</button>
  </div>
  <h2>Loops</h2>
  <div class="row" id="loops"></div>
  <h2>Music</h2>
  <div class="row" id="music"></div>
  <div class="row"><label>intensity <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5"></label></div>
</section>

<section>
  <div class="row"><button id="run">Run automated checks</button><span id="summary"></span></div>
  <div id="results"></div>
  <pre id="log"></pre>
</section>

<script type="module" src="./audio-test.js"></script>
</body>
</html>
