<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Arena preview</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Arena preview: ?arena=causeway&seed=0&x=0&y=-200&zoom=1&w=1280&t=0&figs=1&q=1&dpr=1
//   bench=1  time drawBack+drawFront per frame with a 1-pixel readback after each frame (forces the raster)
//   count=1  count drawImage calls and destination megapixels per frame over a sweep of the camera range
//   src=before  load tools/out/arenas-before.js instead of src/render/arenas.js (for before/after comparisons)
const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? Number(P.get(k)) : d);
const mod = await import(P.get('src') === 'before' ? './out/arenas-before.js' : '../src/render/arenas.js');
const id = P.get('arena') || 'causeway';
const seed = num('seed', 0);
const view = { w: num('w', 1280), h: 720 };
const cam = { x: num('x', 0), y: num('y', -200), zoom: num('zoom', 1) };
const t = num('t', 0);
const dpr = num('dpr', 1);

const cv = document.getElementById('c');
cv.width = Math.round(view.w * dpr); cv.height = Math.round(view.h * dpr);
cv.style.width = view.w + 'px'; cv.style.height = view.h + 'px';
const ctx = cv.getContext('2d', { alpha: false });

// drawImage accounting: calls and destination device pixels, clipped to the canvas.
const stat = { on: false, calls: 0, px: 0, list: null };
const rawDraw = ctx.drawImage.bind(ctx);
function clipArea(pts) {
  let poly = pts;
  const edges = [[0, 1, 0], [0, -1, cv.width], [1, 1, 0], [1, -1, cv.height]]; // axis, sign, offset: sign*p[axis] + offset >= 0
  for (const [ax, s, o] of edges) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const da = s * a[ax] + o, db = s * b[ax] + o;
      if (da >= 0) out.push(a);
      if ((da >= 0) !== (db >= 0)) { const k = da / (da - db); out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]); }
    }
    poly = out;
    if (!poly.length) return 0;
  }
  let A = 0;
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; A += a[0] * b[1] - b[0] * a[1]; }
  return Math.abs(A) / 2;
}
ctx.drawImage = function (img, ...a) {
  if (stat.on) {
    let dx, dy, dw, dh;
    if (a.length === 2) [dx, dy, dw, dh] = [a[0], a[1], img.width, img.height];
    else if (a.length === 4) [dx, dy, dw, dh] = a;
    else [dx, dy, dw, dh] = a.slice(4);
    const m = ctx.getTransform();
    const tp = (x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
    const area = clipArea([tp(dx, dy), tp(dx + dw, dy), tp(dx + dw, dy + dh), tp(dx, dy + dh)]);
    stat.calls++; stat.px += area;
    if (stat.list) stat.list.push({ src: `${img.width}x${img.height}`, mp: +(area / 1e6).toFixed(3), op: ctx.globalCompositeOperation, a: +ctx.globalAlpha.toFixed(2) });
  }
  return rawDraw(img, ...a);
};

const made = [];
const ce = document.createElement.bind(document);
document.createElement = (tag) => { const el = ce(tag); if (tag === 'canvas') made.push(el); return el; };
const t0 = performance.now();
const arena = mod.buildArena(id, { quality: num('q', 1), seed });
document.createElement = ce;
const bakeMs = performance.now() - t0;
// Canvas work may be deferred; include one flushed frame to get the real cost.
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
arena.drawBack(ctx, cam, view, t);
arena.drawFront(ctx, cam, view, t);
ctx.getImageData(0, 0, 1, 1);
const bakeFlushMs = performance.now() - t0;

function figure(wx, facing, outline, blade, pose) {
  const z = cam.zoom;
  const sx = (x) => (x - cam.x) * z + view.w / 2, sy = (y) => (y - cam.y) * z + view.h / 2;
  const f = facing;
  const P = {
    head: [wx + 2 * f, -98], neck: [wx, -84], hip: [wx - 2 * f, -50],
    kneeA: [wx + 14 * f, -26], footA: [wx + 26 * f, 0], kneeB: [wx - 12 * f, -24], footB: [wx - 22 * f, 0],
    elbA: [wx + 18 * f, -66], handA: [wx + 30 * f, -76], elbB: [wx - 14 * f, -64], handB: [wx - 4 * f, -54],
  };
  if (pose === 'jump') { for (const k in P) P[k][1] -= 150; P.footA = [wx + 20 * f, -150 - 16]; P.footB = [wx - 16 * f, -150 - 10]; }
  const segs = [['neck', 'hip'], ['hip', 'kneeA'], ['kneeA', 'footA'], ['hip', 'kneeB'], ['kneeB', 'footB'],
    ['neck', 'elbA'], ['elbA', 'handA'], ['neck', 'elbB'], ['elbB', 'handB']];
  const path = () => {
    ctx.beginPath();
    for (const [a, b] of segs) { ctx.moveTo(sx(P[a][0]), sy(P[a][1])); ctx.lineTo(sx(P[b][0]), sy(P[b][1])); }
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  path(); ctx.strokeStyle = outline; ctx.lineWidth = (9 + 4) * z; ctx.stroke();
  ctx.beginPath(); ctx.arc(sx(P.head[0]), sy(P.head[1]), (12 + 2) * z, 0, Math.PI * 2); ctx.fillStyle = outline; ctx.fill();
  path(); ctx.strokeStyle = '#0a0a0e'; ctx.lineWidth = 9 * z; ctx.stroke();
  ctx.beginPath(); ctx.arc(sx(P.head[0]), sy(P.head[1]), 12 * z, 0, Math.PI * 2); ctx.fillStyle = '#0a0a0e'; ctx.fill();
  if (blade) {
    const hx = sx(P.handA[0]), hy = sy(P.handA[1]);
    const ang = -0.9 * f, len = 92 * z;
    const ex = hx + Math.sin(ang) * len * f * f, ey = hy - Math.cos(ang) * len;
    ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = 5 * z;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - (ex - hx) * 0.14, hy - (ey - hy) * 0.14); ctx.stroke();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [w, a] of [[26, 0.08], [16, 0.16], [9, 0.35], [5, 0.7]]) {
      ctx.strokeStyle = blade.replace('A', a); ctx.lineWidth = w * z;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.2 * z;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.restore();
  }
}

function luma(r, g, b) { return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; }

function stats() {
  // Band directly behind the fighters: ground line up to 320 units above it.
  const sg = (0 - cam.y) * cam.zoom + view.h / 2;
  const top = Math.max(0, Math.round((sg - 320 * cam.zoom) * dpr)), bot = Math.min(view.h * dpr, Math.round(sg * dpr));
  const out = {};
  if (bot > top) {
    const d = ctx.getImageData(0, top, cv.width, bot - top).data;
    let s = 0, s2 = 0, n = 0, mx = 0;
    for (let i = 0; i < d.length; i += 16) { const l = luma(d[i], d[i + 1], d[i + 2]); s += l; s2 += l * l; n++; if (l > mx) mx = l; }
    out.bandMean = +(s / n).toFixed(3);
    out.bandStd = +Math.sqrt(s2 / n - (s / n) ** 2).toFixed(3);
    out.bandMax = +mx.toFixed(3);
  }
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let over = 0, n = 0, s = 0, black = 0;
  for (let i = 0; i < d.length; i += 16) { const l = luma(d[i], d[i + 1], d[i + 2]); s += l; if (l > 0.55) over++; if (!(d[i] | d[i + 1] | d[i + 2])) black++; n++; }
  out.blackPct = +((black / n) * 100).toFixed(2); // pure black only shows where nothing was drawn (a gap)
  out.frameMean = +(s / n).toFixed(3);
  out.over55pct = +((over / n) * 100).toFixed(2);
  return out;
}

// One frame through the same entry points the game uses.
function frame(c, tt) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  arena.drawBack(ctx, c, view, tt);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  arena.drawFront(ctx, c, view, tt);
}
// Camera path used by the benchmark: sweeps the whole contract range.
const half = arena.width / 2 + 200;
const benchCam = (i, n) => {
  const u = i / n;
  return { x: Math.sin(u * Math.PI * 2 * 3) * half, y: -280 + Math.sin(u * Math.PI * 2 * 5 + 1) * 180, zoom: 1.125 + Math.sin(u * Math.PI * 2 * 2) * 0.325 };
};

ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
stat.on = true; stat.calls = 0; stat.px = 0; stat.list = [];
arena.drawBack(ctx, cam, view, t);
const st = stats();
function drawFigures() {
  if (!num('figs', 1)) return;
  figure(cam.x - 300, 1, '#3fe0ff', 'rgba(80,230,255,A)');
  figure(cam.x + 10, -1, '#ff4060', 'rgba(255,60,80,A)');
  figure(cam.x + 250, -1, arena.palette.ambient, null, 'jump');
  figure(cam.x - 540, 1, arena.palette.ambient, null);
}
drawFigures();
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
arena.drawFront(ctx, cam, view, t);
stat.on = false;
const m = ctx.getTransform();
const ctxRestored = m.a === dpr && m.d === dpr && ctx.globalAlpha === 1 && ctx.globalCompositeOperation === 'source-over';

const kept = made.filter((c) => c.width * c.height > 4);
const result = { id, seed, setPiece: arena.setPiece, name: arena.name, palette: arena.palette, bakeMs: +bakeMs.toFixed(1), bakeFlushMs: +bakeFlushMs.toFixed(1),
  canvases: kept.length, maxMP: +(Math.max(...kept.map((c) => c.width * c.height)) / 1e6).toFixed(2),
  totalMPcreated: +(kept.reduce((a, c) => a + c.width * c.height, 0) / 1e6).toFixed(1),
  calls: stat.calls, mp: +(stat.px / 1e6).toFixed(3), ...st, ctxRestored };
if (num('list', 0)) result.list = stat.list;

if (num('count', 0)) {
  // Max calls / megapixels per frame across the contract's camera range, at this view width.
  let maxCalls = 0, maxPx = 0, worst = null;
  const Z = [0.8, 1, 1.2, 1.45], Yc = [-460, -370, -280, -190, -100], X = [-1, -0.5, 0, 0.5, 1];
  for (const z of Z) for (const y of Yc) for (const x of X) for (const tt of [0, 1.7]) {
    stat.on = true; stat.calls = 0; stat.px = 0; stat.list = null;
    frame({ x: x * half, y, zoom: z }, tt);
    stat.on = false;
    if (stat.calls > maxCalls) maxCalls = stat.calls;
    if (stat.px > maxPx) { maxPx = stat.px; worst = { x: x * half, y, zoom: z }; }
  }
  result.sweep = { maxCalls, maxMP: +(maxPx / 1e6).toFixed(3), worst };
}

if (num('bench', 0)) {
  const N = num('n', 240);
  const loop = (draw) => {
    const t2 = performance.now();
    for (let i = 0; i < N; i++) {
      if (draw) frame(benchCam(i, N), i / 60);
      else { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 2, 2); }
      ctx.getImageData(0, 0, 1, 1);
    }
    return (performance.now() - t2) / N;
  };
  loop(true);
  const base = loop(false);
  const runs = [loop(true), loop(true), loop(true)].sort((a, b) => a - b);
  result.frameMs = +(runs[1] - base).toFixed(3);
  result.frameMsMin = +(runs[0] - base).toFixed(3);
  // Back and front separately (front measured over an already-painted frame).
  const part = (which) => {
    const t2 = performance.now();
    for (let i = 0; i < N; i++) {
      const c = benchCam(i, N);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (which === 'back') arena.drawBack(ctx, c, view, i / 60); else arena.drawFront(ctx, c, view, i / 60);
      ctx.getImageData(0, 0, 1, 1);
    }
    return (performance.now() - t2) / N - base;
  };
  result.backMs = +part('back').toFixed(3);
  result.frontMs = +part('front').toFixed(3);
  // restore the still frame (with figures) for the screenshot
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  arena.drawBack(ctx, cam, view, t);
  drawFigures();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  arena.drawFront(ctx, cam, view, t);
}

if (num('dispose', 0) && arena.dispose) {
  arena.dispose();
  result.disposedLeft = kept.filter((c) => c.width * c.height > 0).length;
}

window.__result = result;
console.log(JSON.stringify(result));
</script>
</body>
</html>
